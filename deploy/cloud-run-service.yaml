# TailerAI v2.0 - Google Cloud Run Service Configuration
# This file provides a comprehensive Cloud Run service configuration
# for production deployment with optimal performance and security settings

apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: tailerai-v2
  namespace: 'PROJECT_ID_PLACEHOLDER'
  labels:
    cloud.googleapis.com/location: us-central1
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/ingress-status: all
    run.googleapis.com/execution-environment: gen2
spec:
  template:
    metadata:
      annotations:
        # Autoscaling configuration
        autoscaling.knative.dev/maxScale: '10'
        autoscaling.knative.dev/minScale: '0'
        autoscaling.knative.dev/target: '70'
        autoscaling.knative.dev/targetUtilizationPercentage: '70'
        
        # Performance settings
        run.googleapis.com/cpu-throttling: 'true'
        run.googleapis.com/memory: 2Gi
        run.googleapis.com/cpu: '2'
        run.googleapis.com/timeout: '300s'
        run.googleapis.com/startup-cpu-boost: 'true'
        
        # Cloud SQL connection (uncomment if using Cloud SQL)
        # run.googleapis.com/cloudsql-instances: 'PROJECT_ID_PLACEHOLDER:us-central1:tailerai-db'
        
        # VPC configuration (uncomment if using VPC)
        # run.googleapis.com/vpc-access-connector: 'tailerai-connector'
        # run.googleapis.com/vpc-access-egress: 'private-ranges-only'
        
        # Custom domain configuration (uncomment if using custom domain)
        # run.googleapis.com/custom-audiences: 'https://tailerai.yourcompany.com'
        
    spec:
      containerConcurrency: 100
      timeoutSeconds: 300
      containers:
      - image: gcr.io/PROJECT_ID_PLACEHOLDER/tailerai-v2:latest
        name: tailerai-v2
        ports:
        - name: http1
          containerPort: 8080
        
        # Environment variables
        env:
        - name: ENVIRONMENT
          value: production
        - name: DEBUG
          value: 'False'
        - name: HOST
          value: '0.0.0.0'
        - name: PORT
          value: '8080'
        - name: LOG_LEVEL
          value: 'INFO'
        - name: LATEX_ENGINE
          value: tectonic
        - name: LATEX_ENGINE_PATH
          value: /usr/local/bin/tectonic
        
        # Database configuration
        - name: DATABASE_URL
          value: 'sqlite:///./data/database/tailer_v2.db'
        
        # Performance settings
        - name: MAX_FILE_SIZE
          value: '10485760'  # 10MB
        - name: REQUEST_TIMEOUT
          value: '300'
        
        # AI service configuration
        - name: ENABLE_AI_CONTENT_SELECTION
          value: 'true'
        - name: ENABLE_AI_ATS_OPTIMIZATION
          value: 'true'
        - name: ENABLE_AI_CONTENT_ENHANCEMENT
          value: 'true'
        - name: ENABLE_AI_PERSONALIZATION
          value: 'true'
        - name: GEMINI_REQUESTS_PER_MINUTE
          value: '60'
        - name: GEMINI_DAILY_LIMIT
          value: '1500'
        
        # CORS configuration
        - name: ALLOWED_ORIGINS
          value: 'https://tailerai-v2-PROJECT_ID_PLACEHOLDER.run.app,https://yourdomain.com'
        
        # Frontend configuration
        - name: FRONTEND_URL
          value: 'https://tailerai-v2-PROJECT_ID_PLACEHOLDER.run.app'
        
        # Security settings (from Secret Manager)
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              key: latest
              name: tailerai-secret-key
        - name: JWT_SECRET_KEY
          valueFrom:
            secretKeyRef:
              key: latest
              name: tailerai-jwt-secret
        - name: GEMINI_API_KEY
          valueFrom:
            secretKeyRef:
              key: latest
              name: tailerai-gemini-api-key
        
        # Optional: Google OAuth configuration
        - name: GOOGLE_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              key: latest
              name: tailerai-google-client-secret
              optional: true
        
        # Resource limits
        resources:
          limits:
            cpu: '2'
            memory: 2Gi
          requests:
            cpu: '1'
            memory: 1Gi
        
        # Health checks
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
          successThreshold: 1
        
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
          successThreshold: 1
        
        # Startup probe for longer initialization times
        startupProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 10
          failureThreshold: 30
          successThreshold: 1
      
      # Service account for secure access to Google Cloud services
      serviceAccountName: 'tailerai-v2-sa@PROJECT_ID_PLACEHOLDER.iam.gserviceaccount.com'
      
  traffic:
  - percent: 100
    latestRevision: true